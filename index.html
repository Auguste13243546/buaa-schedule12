<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8ecf3" />
    <title>我的日程</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 背景层：纯抽象柔色渐变，用于承载玻璃材质的折射，不含任何具象图形 -->
    <div class="ambient" aria-hidden="true">
      <div class="ambient-wash"></div>
      <div class="ambient-orb orb-a"></div>
      <div class="ambient-orb orb-b"></div>
      <div class="ambient-orb orb-c"></div>
      <div class="ambient-grain"></div>
    </div>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">
          <h1 id="view-title">今日</h1>
          <p id="term-line"></p>
        </div>
        <nav class="tabs tabs-wide" id="tabs-wide"></nav>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs tabs-narrow" id="tabs-narrow"></nav>

    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>

    <script src="js/calendar.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
